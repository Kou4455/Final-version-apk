    <script>
      // Suppress benign [vite] HMR websocket connection failures in containerized sandbox
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Intercept console errors/warnings mentioning [vite]
        var _origErr = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && arg.message ? arg.message : '');
            if (str && (str.indexOf('[vite]') !== -1 || (str.indexOf('vite') !== -1 && str.indexOf('websocket') !== -1))) {
              return;
            }
          }
          return _origErr.apply(console, arguments);
        };

        var _origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            var str = typeof arg === 'string' ? arg : (arg && arg.message ? arg.message : '');
            if (str && (str.indexOf('[vite]') !== -1 || (str.indexOf('vite') !== -1 && str.indexOf('websocket') !== -1))) {
              return;
            }
          }
          return _origWarn.apply(console, arguments);
        };

        // 2. Prevent unhandled rejections from Vite HMR websocket failures
        window.addEventListener('unhandledrejection', function(event) {
          var str = String(event.reason && (event.reason.message || event.reason) || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        // 3. Prevent window error events from Vite HMR
        window.addEventListener('error', function(event) {
          var str = String(event.message || '');
          if (str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        // 4. Safely satisfy Vite HMR client WebSockets without network attempts
        if (typeof window.WebSocket !== 'undefined') {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isVite = protocols === 'vite-hmr' || protocols === 'vite-ping' ||
              (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) ||
              (typeof url === 'string' && (url.indexOf('24678') !== -1 || url.indexOf('token=') !== -1));

            if (isVite) {
              var listeners = {};
              var dummyWs = {
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                url: url,
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ''),
                send: function() {},
                close: function() {},
                addEventListener: function(event, handler) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(handler);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { handler({ type: 'open', target: dummyWs }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, handler) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                  }
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null
              };
              setTimeout(function() {
                if (typeof dummyWs.onopen === 'function') {
                  try { dummyWs.onopen({ type: 'open', target: dummyWs }); } catch(e) {}
                }
              }, 0);
              return dummyWs;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
