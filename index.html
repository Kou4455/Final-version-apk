    <script>
      // Initialize React refresh preamble synchronously
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;

      // Suppress benign [vite] HMR messages in containerized sandbox
      (function() {
        if (typeof window === 'undefined') return;

        var isViteMsg = function(args) {
          for (var i = 0; i < args.length; i++) {
            var arg = args[i];
            var str = typeof arg === 'string'
              ? arg
              : (arg && (arg.message || arg.stack) ? (String(arg.message) + ' ' + String(arg.stack || '')) : (arg ? String(arg) : ''));
            if (str && (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('vite-hmr') !== -1 ||
              str.indexOf('preamble') !== -1 ||
              (str.indexOf('vite') !== -1 && str.indexOf('websocket') !== -1)
            )) {
              return true;
            }
          }
          return false;
        };

        // 1. Intercept all console methods
        ['error', 'warn', 'info', 'debug', 'log'].forEach(function(method) {
          var orig = console[method];
          if (typeof orig === 'function') {
            console[method] = function() {
              if (isViteMsg(arguments)) return;
              return orig.apply(console, arguments);
            };
          }
        });

        // 2. Prevent unhandled rejections from Vite HMR websocket failures or preamble
        window.addEventListener('unhandledrejection', function(event) {
          var str = String((event.reason && (event.reason.message || event.reason.stack || event.reason)) || '');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1 || str.indexOf('preamble') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        // 3. Prevent window error events from Vite HMR or preamble
        window.addEventListener('error', function(event) {
          var str = String((event.message || '') + ' ' + ((event.error && (event.error.message || event.error.stack)) || ''));
          if (str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('preamble') !== -1 || str.indexOf('WebSocket') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
